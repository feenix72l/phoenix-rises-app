<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Rises | Download</title>
  <style>
    :root {
      --bg: #050510;
      --panel: rgba(255,255,255,0.04);
      --panel-border: rgba(0,204,255,0.35);
      --primary: #00ccff;
      --green: #00ff88;
      --pink: #ff0066;
      --orange: #ff6600;
      --text: #f5f7ff;
      --muted: #a0adc4;
      --button: linear-gradient(90deg, #00ccff, #00ff88);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(circle at top, rgba(0,204,255,0.12), transparent 30%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 30px 16px 70px;
    }

    .wrapper {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
      align-items: center;
    }

    .card {
      background: rgba(10, 11, 24, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(0,204,255,0.12);
      padding: 28px;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: inline-flex; align-items: center; gap: 12px;
      font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 12px; background: linear-gradient(135deg, var(--pink), var(--orange));
      font-size: 22px; box-shadow: 0 0 18px rgba(255, 102, 0, 0.35);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.2rem, 4vw, 4rem);
      line-height: 1.02;
      letter-spacing: -0.05em;
      font-weight: 900;
      background: linear-gradient(90deg, var(--green), var(--primary), var(--pink), var(--orange));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .actions {
      display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px;
    }

    .button {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 15px 22px; border-radius: 14px; border: none; cursor: pointer;
      text-decoration: none; font-weight: 800; font-size: 0.96rem; transition: transform 0.2s ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button:active { transform: scale(0.98); }

    .primary {
      background: var(--button);
      color: #031018;
      box-shadow: 0 0 24px rgba(0, 255, 136, 0.25);
    }

    .secondary {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .mini-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px;
    }

    .mini-stat {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 16px 12px; text-align: center;
    }

    .mini-stat strong {
      display: block; font-size: 1.35rem; color: var(--green); margin-bottom: 6px;
    }

    .mini-stat span { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }

    .qr-panel {
      padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    }

    .qr-image {
      width: min(280px, 80vw);
      height: auto;
      border-radius: 18px;
      background: white;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 20px rgba(0,204,255,0.12);
    }

    .qr-url {
      background: rgba(0,0,0,0.35);
      border: 1px dashed rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      word-break: break-all;
      width: 100%;
    }

    @media (max-width: 760px) {
      .wrapper { grid-template-columns: 1fr; }
      .mini-stats { grid-template-columns: 1fr; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">🔥</div>
        <span>Phoenix Rises</span>
      </div>

      <h1>Download the app and share the live link.</h1>
      <p>
        Phoenix Rises is a mobile-first dashboard for live operations, wallet tracking, payout flows, and quick access to app activity.
      </p>

      <div class="actions">
        <a class="button primary" href="Phoenix-Rises-App.html" download="Phoenix-Rises-App.html">Download App</a>
        <a class="button secondary" href="Phoenix-Rises-App.html" target="_blank" rel="noreferrer">Open App</a>
      </div>

      <div class="mini-stats">
        <div class="mini-stat">
          <strong>50</strong>
          <span>Agents</span>
        </div>
        <div class="mini-stat">
          <strong>$245</strong>
          <span>Balance</span>
        </div>
        <div class="mini-stat">
          <strong>24/7</strong>
          <span>Live</span>
        </div>
      </div>
    </div>

    <div class="card qr-panel">
      <img
        class="qr-image"
        alt="QR code for Phoenix Rises live link"
        src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://feenix72l.github.io/phoenix-rises-app/"
      />
      <div class="qr-url">https://feenix72l.github.io/phoenix-rises-app/</div>
    </div>
  </div>
</body>
</html>
